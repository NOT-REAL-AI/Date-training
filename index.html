            padding: 10px;

            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border-left: 5px solid #1a73e8;
        }
        .question-year {
            font-size: 32px;
            font-weight: bold;
            color: #1a73e8;
            margin: 0;
        }
        .question-text {
            font-size: 16px;
            color: #555;
            margin-top: 5px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: #fff;
            border: 2px solid #dadce0;
            border-radius: 8px;
            padding: 15px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #3c4043;
            font-weight: 500;
        }
        .option-btn:hover {
            background-color: #f1f3f4;
            border-color: #bdc1c6;
        }
        .option-btn.correct {
            background-color: #e6f4ea;
            border-color: #34a853;
            color: #137333;
        }
        .option-btn.wrong {
            background-color: #fce8e6;
            border-color: #ea4335;
            color: #c5221f;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }
        .feedback {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            min-height: 24px;
            font-size: 16px;
        }
        .feedback.correct { color: #137333; }
        .feedback.wrong { color: #c5221f; }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            align-items: center;
        }
        .next-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: none;
            transition: background-color 0.2s;
        }
        .next-btn:hover {
            background-color: #1557b0;
        }
        .reset-btn {
            background: none;
            border: none;
            color: #5f6368;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }

        { year: "2028 г.", text: "XXXIV ОИ – Лос-Анджелес, США" },

    // ==========================================
    // ЛОГИКА ТРЕНАЖЕРА
    // ==========================================

    // Переменные состояния
    let questions = [];
    let currentQuestion = null;
    let score = 0;
    let errorCount = 0;
    let totalQuestions = 0;

    // Функция для парсинга года в число (для сортировки и поиска близких дат)
    function parseYear(yearStr) {
        if (yearStr.includes('до н.э.')) {
            return -parseInt(yearStr.replace(/\D/g, ''));
        }
        if (yearStr.includes('век')) {
            let century = parseInt(yearStr.replace(/\D/g, ''));
            return century * 100; // Приблизительно
        }
        return parseInt(yearStr.replace(/\D/g, ''));
    }

    // Подготовка данных: создаем уникальные события и сортируем по году
    function prepareData() {
        let uniqueEvents = [];
        let seen = new Set();
        
        rawEvents.forEach(e => {
            let key = e.year + '|' + e.text;
            if (!seen.has(key)) {
                seen.add(key);
                uniqueEvents.push({
                    year: e.year,
                    text: e.text,
                    yearNum: parseYear(e.year)
                });
            }
        });

        // Сортируем по году
        uniqueEvents.sort((a, b) => a.yearNum - b.yearNum);
        return uniqueEvents;
    }

    const allEvents = prepareData();

    // Инициализация / Сброс
    function initGame() {
        // Перемешиваем базу, чтобы вопросы шли в случайном порядке
        questions = [...allEvents].sort(() => Math.random() - 0.5);
        totalQuestions = questions.length;
        score = 0;
        errorCount = 0;
        updateStats();
        nextQuestion();
    }

    // Получить следующий вопрос
    function nextQuestion() {
        if (questions.length === 0) {
            alert("Вы прошли все вопросы! Отличная работа!");
            resetProgress();
            return;
        }

        // Берем первый вопрос из перемешанного массива
        currentQuestion = questions.shift();
        
        // Отображаем год
        document.getElementById('year-display').textContent = currentQuestion.year;
        
        // Генерируем варианты ответов
        generateOptions(currentQuestion);
        
        // Сбрасываем интерфейс
        document.getElementById('feedback').textContent = '';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('q-counter').textContent = totalQuestions - questions.length;
    }

    // Генерация 4 вариантов ответа
    function generateOptions(correctEvent) {
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        // 1. Находим "соседей" по времени (в пределах +/- 100 лет, чтобы было правдоподобно)
        let pool = allEvents.filter(e => 
            Math.abs(e.yearNum - correctEvent.yearNum) <= 100 && 
            e.text !== correctEvent.text
        );

        // Если пул слишком маленький (например, для будущих дат), берем просто случайные
        if (pool.length < 3) {
            pool = allEvents.filter(e => e.text !== correctEvent.text);
        }

        // Перемешиваем пул и берем 3 случайных
        let wrongOptions = pool.sort(() => Math.random() - 0.5).slice(0, 3);

        // Собираем все варианты вместе
        let options = [
            { text: correctEvent.text, isCorrect: true },
            ...wrongOptions.map(o => ({ text: o.text, isCorrect: false }))
        ];

        // Перемешиваем варианты, чтобы правильный ответ был не всегда первым
        options.sort(() => Math.random() - 0.5);

        // Создаем кнопки
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.text;
            btn.onclick = () => checkAnswer(btn, opt.isCorrect, correctEvent);
            container.appendChild(btn);
        });
    }

    // Проверка ответа
    function checkAnswer(btn, isCorrect, correctEvent) {
        // Блокируем все кнопки
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const feedback = document.getElementById('feedback');

        if (isCorrect) {
            btn.classList.add('correct');
            feedback.textContent = '✅ Верно!';
            feedback.className = 'feedback correct';
            score++;
            
            // Если ответили верно, уменьшаем частоту этого вопроса (убираем из пула на потом)
            // В нашей логике мы просто не возвращаем его в questions, но можно добавить в конец
            // Для простоты оставим как есть (он просто исчезает).
        } else {
            btn.classList.add('wrong');
            feedback.textContent = '❌ Ошибка! Правильный ответ выделен зеленым.';
            feedback.className = 'feedback wrong';
            errorCount++;

            // Подсвечиваем правильный ответ
            allBtns.forEach(b => {
                if (b.textContent === correctEvent.text) {
                    b.classList.add('correct');
                }
            });

            // ВАЖНО: Система запоминания - если ошиблись, возвращаем этот вопрос в конец очереди
            questions.push(correctEvent);
        }

        updateStats();
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    // Обновление статистики
    function updateStats() {
        document.getElementById('score').textContent = score;
        document.getElementById('errors').textContent = errorCount;
        document.getElementById('q-counter').textContent = totalQuestions - questions.length;
    }

    // Сброс прогресса
    function resetProgress() {
        if (confirm("Вы уверены, что хотите сбросить весь прогресс?")) {
            localStorage.removeItem('sportTrainerState');
            initGame();
        }
    }

    // Сохранение состояния (упрощенное, для примера сохраняем счет)
    function saveState() {
        localStorage.setItem('sportTrainerState', JSON.stringify({
            score: score,
            errors: errorCount,
            questionsLeft: questions.length
        }));
    }

    // Запуск
    window.onload = () => {
        initGame();
    };
</script>
