        .menu-title {

            cursor: pointer;
            margin-bottom: 15px;

            text-align: center;
            font-weight: 600;
        }
        .menu-btn:hover {
            background-color: #1557b0;
            transform: translateY(-2px);
        }
        .menu-btn.secondary {
            background-color: #34a853;
        }
        .menu-btn.secondary:hover {
            background-color: #2d8e47;
        }

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border-left: 5px solid #1a73e8;
        }
        .question-title {
            font-size: 28px;
            font-weight: bold;
            color: #1a73e8;
            margin: 0;
        }
        .question-subtitle {
            font-size: 14px;
            color: #555;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: #fff;
            border: 2px solid #dadce0;
            border-radius: 8px;
            padding: 15px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #3c4043;
            font-weight: 500;
            line-height: 1.4;
        }
        .option-btn:hover {
            background-color: #f1f3f4;
            border-color: #bdc1c6;
        }
        .option-btn.correct {
            background-color: #e6f4ea;
            border-color: #34a853;
            color: #137333;
        }
        .option-btn.wrong {
            background-color: #fce8e6;
            border-color: #ea4335;
            color: #c5221f;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }
        .feedback {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            min-height: 24px;
            font-size: 16px;
        }
        .feedback.correct { color: #137333; }
        .feedback.wrong { color: #c5221f; }

            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            align-items: center;
        }
        .next-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: none;
            transition: background-color 0.2s;
        }
        .next-btn:hover {
            background-color: #1557b0;
        }
        .reset-btn {
            background: none;
            border: none;
            color: #5f6368;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
        .back-btn {
            background: none;
            border: none;
            color: #1a73e8;

            margin-bottom: 10px;

        </div>

        <div class="options" id="options-container">
            <!-- Кнопки вариантов будут здесь -->
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="controls">

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Следующий вопрос ➡</button>
        </div>
    </div>

</div>

        { term: "Шейпинг", def: "система преимущественно силовых упражнений для женщин, направленная на коррекцию фигуры и улучшение функционального состояния организма." },

        { term: "Энергетический баланс", def: "соотношение количества энергии, поступающей с пищей и энергией, расходуемой организмом." },
        { term: "Эфеб", def: "в Древней Греции, юноша, достигший возраста, когда он обретал все права гражданина и мог принимать участие в Олимпийских Играх." }

    // ==========================================
    // ЛОГИКА ТРЕНАЖЕРА
    // ==========================================
    
    let currentMode = 'dates'; // 'dates' или 'definitions'
    let questions = [];
    let currentQuestion = null;
    let score = 0;
    let errorCount = 0;
    let totalQuestions = 0;

    // Парсинг года для сортировки (для режима дат)
    function parseYear(yearStr) {
        if (yearStr.includes('до н.э.')) return -parseInt(yearStr.replace(/\D/g, ''));
        if (yearStr.includes('век')) return parseInt(yearStr.replace(/\D/g, '')) * 100;
        return parseInt(yearStr.replace(/\D/g, ''));
    }

    // Подготовка данных для дат
    function prepareDateData() {
        let uniqueEvents = [];
        let seen = new Set();
        rawEvents.forEach(e => {
            let key = e.year + '|' + e.text;
            if (!seen.has(key)) {
                seen.add(key);
                uniqueEvents.push({ year: e.year, text: e.text, yearNum: parseYear(e.year) });
            }
        });
        return uniqueEvents.sort((a, b) => a.yearNum - b.yearNum);
    }

    // Подготовка данных для определений
    function prepareDefData() {
        let uniqueDefs = [];
        let seen = new Set();
        rawDefinitions.forEach(d => {
            if (!seen.has(d.term)) {
                seen.add(d.term);
                uniqueDefs.push(d);
            }
        });
        return uniqueDefs;
    }

    const allDateEvents = prepareDateData();
    const allDefs = prepareDefData();

    // Переключение экранов
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goToMenu() {
        showScreen('screen-menu');
    }

    // Запуск режима
    function startMode(mode) {
        currentMode = mode;
        showScreen('screen-game');
        initGame();
    }

    function initGame() {
        score = 0;
        errorCount = 0;
        
        if (currentMode === 'dates') {
            questions = [...allDateEvents].sort(() => Math.random() - 0.5);
            document.getElementById('question-type').textContent = "Что произошло в этом году?";
        } else {
            questions = [...allDefs].sort(() => Math.random() - 0.5);
            document.getElementById('question-type').textContent = "Выберите правильное определение";
        }
        
        totalQuestions = questions.length;
        updateStats();
        nextQuestion();
    }

    function nextQuestion() {
        if (questions.length === 0) {
            alert("Вы прошли все вопросы в этом режиме! Отличная работа!");
            goToMenu();
            return;
        }

        currentQuestion = questions.shift();
        document.getElementById('question-display').textContent = 
            currentMode === 'dates' ? currentQuestion.year : currentQuestion.term;
        
        generateOptions(currentQuestion);
        
        document.getElementById('feedback').textContent = '';
        document.getElementById('next-btn').style.display = 'none';
        updateStats();
    }

    function generateOptions(correctItem) {
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        let pool = [];
        let correctText = currentMode === 'dates' ? correctItem.text : correctItem.def;

        if (currentMode === 'dates') {
            // Логика для дат: ищем в пределах +/- 100 лет
            pool = allDateEvents.filter(e => 
                Math.abs(e.yearNum - correctItem.yearNum) <= 100 && 
                e.text !== correctText
            );
            if (pool.length < 3) pool = allDateEvents.filter(e => e.text !== correctText);
        } else {
            // Логика для определений: ищем похожие по смыслу (по ключевым словам или просто случайные из той же категории)
            // Чтобы не подбирать рядом стоящие, берем случайные определения из всей базы, 
            // но исключаем правильный ответ. Это гарантирует, что варианты будут из разных разделов, но семантически похожи.
            // Для более точной имитации "похожих" определений можно фильтровать по длине или ключевым словам.
            pool = allDefs.filter(d => d.def !== correctText);
            
            // Дополнительная фильтрация: чтобы варианты не были слишком короткими или слишком длинными
            // (исключаем очевидные "Агон - борьба", если правильный ответ длинный)
            if (pool.length > 3) {
                // Сортируем по разнице в длине с правильным ответом и берем похожие по длине
                pool.sort((a, b) => Math.abs(a.def.length - correctText.length) - Math.abs(b.def.length - correctText.length));
                // Берем из первых 20 похожих по длине, чтобы не было повторов
                pool = pool.slice(0, 20); 
            }
        }

        let wrongOptions = pool.sort(() => Math.random() - 0.5).slice(0, 3);

        let options = [
            { text: correctText, isCorrect: true },
            ...wrongOptions.map(o => ({ text: currentMode === 'dates' ? o.text : o.def, isCorrect: false }))
        ];

        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.text;
            btn.onclick = () => checkAnswer(btn, opt.isCorrect, correctItem);
            container.appendChild(btn);
        });
    }

    function checkAnswer(btn, isCorrect, correctItem) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);
        const feedback = document.getElementById('feedback');

        if (isCorrect) {
            btn.classList.add('correct');
            feedback.textContent = '✅ Верно!';
            feedback.className = 'feedback correct';
            score++;
        } else {
            btn.classList.add('wrong');
            feedback.textContent = '❌ Ошибка! Правильный ответ выделен зеленым.';
            feedback.className = 'feedback wrong';
            errorCount++;

            let correctText = currentMode === 'dates' ? correctItem.text : correctItem.def;
            allBtns.forEach(b => {
                if (b.textContent === correctText) {
                    b.classList.add('correct');
                }
            });

            // Система запоминания: возвращаем вопрос в конец очереди
            questions.push(correctItem);
        }

        updateStats();
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function updateStats() {
        document.getElementById('score').textContent = score;
        document.getElementById('errors').textContent = errorCount;
        document.getElementById('q-counter').textContent = totalQuestions - questions.length;
    }

    function resetCurrentMode() {
        if (confirm("Вы уверены, что хотите сбросить прогресс в этом режиме?")) {
            initGame();
        }
    }

    // Запуск при загрузке
    window.onload = () => {
        showScreen('screen-menu');
    };
</script>
